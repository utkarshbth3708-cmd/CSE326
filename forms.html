<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
  
    
    <form action="" method="get">
        <fieldset>
            <legend><b>REGISTRATION FORM</b></legend>
            <label for="upload">upload file:</label>
            <input type="file" id="upload" name="upload" accept="image/*">
            <br><br>
            <label for="marks">enter marks::</label>
            <input type="number" id="marks" max="20" min="0" step="3">



            <input type="date" id="date" name="date">
            <input type="time" id="time" name="time">
            <input type="file" name="submit" id="submit" value="submit form">
            <input type="button" value="ok">
            















        </fieldset>

        <label for="u1">Username:</label>

        <input type="text" id="u1" name="uname" maxlength="8" placeholder="enter username" size="50">
        <br><br>

        <label for="p2">password</label>
        <input type="password" id="p2"  name="password" placeholder="enter password">
        <br><br>
        
        <label for="e3">email</label>
        <input type="email" id="e3" name="email" placeholder="enter email address" size="50">
        <br><br>

        <label for="add1">enter address:</label>

        <textarea name="address" id="add1" rows="10" cols="10"> jalandhar </textarea>

        <br><br>

        <label for="h1">hobbies:</label>
        <input type="checkbox" name="hobby" >
        <label for="cook1">cooking</label>
        <input type="checkbox" name="hobby" id="cook1" value="cook">
        <label for="speak1">public speaking</label>
        <input type="checkbox" name="hobby" id="speak1" value="speak">
        <label for="read1">reading</label>
        <input type="checkbox" name="hobby" id="read1" value="read">
        <br><br>

        <label for="course">select your course:</label>

        <label for="btech">btech</label>
        <input type="radio" name="course" id="btech" value="btech" checked>
        <label for="bca"> bca</label>
        <input type="radio" name="course" id="bca" value="bca">
        <label for="mba">mba</label>
        <input type="radio" name="course" id="mba" value="mba">







<label for="state">select your state:</label>
        <select name="state" id="state" size="2" multiple> 
     <option value="punjab">Punjab</option>
            <option value="haryana">Haryana</option>
            <option value="Rajasthan">Rajasthan</option>
            <option value="Bihar">Bihar</option>
            <option value="jammu">jammu</option>
        </select>

        <br><br>



        <input type="submit" value="submit">


    </form>
</body>
</html>
